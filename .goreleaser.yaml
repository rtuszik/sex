---
version: 2

builds:
    - main: ./cmd/sex
      binary: sex
      env:
        - CGO_ENABLED=0
      goos: [darwin, linux]
      goarch: [amd64, arm64]
      ldflags:
        - -s -w -X main.version={{ .Version }}

archives:
    - formats: [tar.gz]
      files:
        - LICENSE
        - THIRD_PARTY_LICENSES.md
        - README.md

checksum:
    name_template: checksums.txt

changelog:
    use: github
    filters:
        exclude:
            - "^chore"
            - "^docs"
            - "^test"
